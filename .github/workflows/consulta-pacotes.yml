# Temporário (branch evolucao-trajeto): instala o expo-task-manager na versão do SDK e mostra as entradas que o npm
# gerou no package-lock.json, para serem copiadas. Removido no commit seguinte.
name: Consulta de pacotes
on:
  push:
    branches: [evolucao-trajeto]
jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx expo install expo-task-manager -- --ignore-scripts
      - name: Entradas do lock
        run: |
          node -e "
          const lock=require('./package-lock.json');const pkg=require('./package.json');
          console.log('::notice title=package.json::'+JSON.stringify({dep:pkg.dependencies['expo-task-manager'],root:lock.packages[''].dependencies['expo-task-manager']}));
          for (const k of Object.keys(lock.packages).filter(k=>/expo-task-manager|unimodules-app-loader/.test(k))) console.log('::notice title='+k+'::'+JSON.stringify(lock.packages[k]));
          "
          git diff --stat
