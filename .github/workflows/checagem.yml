# Checagem automática do app a cada envio para a branch de desenvolvimento e a cada pull request.
# Versão independente: a branch de trabalho é "evolucao" (sem PR, merge ou deploy). Nada aqui publica o app.
# Roda as mesmas verificações exigidas antes de um PR (npm run check) e o build web do Netlify.
# Também gera prints das telas principais (modo demonstração, dados fictícios) para revisão visual.
name: Checagem do app

on:
  push:
    branches: [evolucao, desenvolvimento, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, evolucao, desenvolvimento]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checagem:
    name: Tipos, lint, traduções e build web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # As três partes do "npm run check" em passos separados: cada falha aparece com arquivo e linha
      # nas anotações do GitHub (inclusive erros de leitura do ESLint, que não trazem nome de regra).
      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Lint (ESLint)
        if: ${{ !cancelled() }}
        run: |
          status=0
          npx eslint . --format json --output-file eslint-report.json || status=$?
          node .github/scripts/lint-annotations.js eslint-report.json
          exit $status

      - name: Traduções
        if: ${{ !cancelled() }}
        run: |
          status=0
          npm run --silent i18n:check > i18n-report.txt 2>&1 || status=$?
          cat i18n-report.txt
          if [ "$status" -ne 0 ]; then
            grep -vE '^\s*$' i18n-report.txt | head -40 | sed 's/^/::error title=Traduções::/'
          fi
          exit $status

      - name: Testes das regras de negócio (node --test)
        if: ${{ !cancelled() }}
        run: npm test

      - name: Formatação (Biome, só informativo)
        run: npm run format:check
        continue-on-error: true

      - name: Build web (o mesmo do Netlify)
        run: npx expo export --platform web

      - name: Build web de demonstração (dados fictícios, para os prints)
        # --clear: sem ele, o cache do Metro reaproveita o EXPO_PUBLIC_USE_MOCKS do build anterior.
        run: npx expo export --platform web --output-dir dist-demo --clear
        env:
          EXPO_PUBLIC_USE_MOCKS: 'true'
          EXPO_PUBLIC_ENABLE_SIGHTING_REPORTS: 'true'
          EXPO_PUBLIC_ENABLE_CASE_TIMELINE: 'true'
          EXPO_PUBLIC_ENABLE_SEARCH_NETWORK: 'true'
          EXPO_PUBLIC_ENABLE_AI_ASSIST: 'true'
          EXPO_PUBLIC_ENABLE_VOLUNTEERS: 'true'
          EXPO_PUBLIC_ENABLE_VISION: 'true'

      - name: Prints das telas (celular, claro e escuro)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1 serve@14.2.4
          npx playwright install --with-deps chromium
          npx serve dist-demo -l 4173 > /tmp/serve.log 2>&1 &
          sleep 3
          node .github/scripts/preview-screenshots.js http://localhost:4173 prints
        continue-on-error: true

      # Abre as telas da evolução no build de demonstração e anota erros de JavaScript ou texto que não apareceu.
      - name: Teste de fumaça das telas da evolução (dados fictícios)
        run: node .github/scripts/smoke-routes.js http://localhost:4173
        continue-on-error: true

      - name: Guardar os prints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-das-telas
          path: prints/
          retention-days: 14
          if-no-files-found: ignore
